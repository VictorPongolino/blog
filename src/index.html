<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Victor Pongolino</title>
  <base href="/">
  <script>
    (function () {
      var baseHref = document.querySelector('base')?.getAttribute('href') || '/';
      if (!baseHref.endsWith('/')) {
        baseHref += '/';
      }

      var appRoot = baseHref.replace(/(en|pt)\/$/, '');

      var path = window.location.pathname;
      var rootPath = appRoot.slice(0, -1);
      var escapedRoot = appRoot.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var localePathPattern = new RegExp('^' + escapedRoot + '(en|pt)(/|$)');

      if (localePathPattern.test(path)) {
        return;
      }

      if (path !== appRoot && path !== rootPath) {
        return;
      }

      var userLanguage = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
      if (userLanguage.startsWith('pt')) {
        window.location.replace(appRoot + 'pt/');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close,search">  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
