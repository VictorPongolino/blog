<aside [class.navbar-fixed]="navbarFixed">
    <div class="bio">
        <div class="profile">
            <img [src]="profile.avatar" [alt]="profile.fullName">
            <h4 class="profile-name">{{ profile.fullName }}</h4>
            <p>{{ profile.title }}</p>
        </div>

        <ul class="social-links">
            <li><a [href]="profile.socialLinks.github" class="fa-brands fa-github" target="_blank" rel="noopener noreferrer"></a></li>
            <li><a [href]="profile.socialLinks.linkedin" class="fa-brands fa-linkedin" target="_blank" rel="noopener noreferrer"></a></li>
            <li><a [href]="profile.socialLinks.youtube" class="fa-brands fa-youtube" target="_blank" rel="noopener noreferrer"></a></li>
        </ul>
    </div>

    <div class="searchbar">
        <div class="searchbar-input">
            <input #searchInput type="text" placeholder="Pesquisar" i18n-placeholder="@@aside-search-placeholder">
            <span
                class="material-symbols-outlined close-btn"
                role="button"
                tabindex="0"
                (click)="searchInput.value = ''; onStopSearch()"
                i18n-aria-label="@@aside-clear-search-aria"
                aria-label="Limpar busca"
            >close</span>
            <span
                class="material-symbols-outlined"
                role="button"
                tabindex="0"
                (click)="onSearchContent(searchInput.value)"
                (keydown.enter)="onSearchContent(searchInput.value)"
                i18n-aria-label="@@aside-search-action-aria"
                aria-label="Pesquisar"
            >search</span>
        </div>
    </div>
    
    @if(recommended.length > 0) {
        <div class="suggested-articles"> 
            <h4 i18n="@@aside-see-also">Veja também</h4>
            <ul>
                @for(recommended_posts of recommended; track recommended_posts.slug) {
                    <li class="suggested-article-item">
                        <a [routerLink]="['/', recommended_posts.slug]">
                            <img src="{{ recommended_posts.image }}" alt="{{ recommended_posts.title }}">
                            <h5>{{ recommended_posts.title }}</h5>
                        </a>
                    </li>
                }
            </ul>
        </div>
    }
</aside>
