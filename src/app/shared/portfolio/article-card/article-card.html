<button
    type="button"
    class="article-card-link"
    [class.layout-top]="imageLayout() === ARTICLE_CARD_LAYOUT.TOP"
    [class.layout-left]="imageLayout() === ARTICLE_CARD_LAYOUT.LEFT"
    [style.width.px]="cardWidth()"
    [style.min-height.px]="cardHeight()"
    (click)="onOpen()">
    @if (image()) {
        <figure class="main-image-link">
            <img
                class="main-image"
                [src]="image()"
                [alt]="title()"
                [style.max-width.px]="maxImageWidth()"
                [style.max-height.px]="maxImageHeight()"
                i18n-alt="@@article-main-image-alt" />
            @if (imageLayout() === ARTICLE_CARD_LAYOUT.TOP) {
                <div class="dark-transition"></div>
            }
        </figure>
    }

    <div class="article-title-section">
        <h2 class="article-title" [style.font-size]="titleFontSize()">{{ title() }}</h2>
        @if (showDescription() && description().trim().length > 0) {
            <p class="article-description" [style.font-size]="descriptionFontSize()">{{ description() }}</p>
        }
    </div>
</button>
