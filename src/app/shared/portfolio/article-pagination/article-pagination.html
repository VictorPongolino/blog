<nav class="pagination-card" role="navigation" aria-label="Pagination">
    
    <button class="pagination-nav prev"
            [style.visibility]="hasPrevButton() ? 'visible' : 'hidden'"
            [attr.aria-label]="'Go to previous page'"
            [disabled]="!hasPrevButton()"
            (click)="onPageClick(currentPage() - 1)">
        <span class="chevron">&lsaquo;</span> Back
    </button>

    <div class="pagination-numbers">
        @if (showFirstPage()) {
            <button 
                class="page-number"
                [class.active]="firstPage() === currentPage()"
                [attr.aria-label]="'Go to page ' + firstPage()"
                [attr.aria-current]="firstPage() === currentPage() ? 'page' : null"
                (click)="onPageClick(firstPage()!)">{{ firstPage() }}</button>
        }

        @if (showEllipsis() && showFirstPage()) {
            <span class="dots" aria-hidden="true">...</span>
        }

        @for (page of visiblePages(); track page) {
            <button 
                class="page-number"
                [class.active]="page === currentPage()"
                [attr.aria-label]="'Go to page ' + page"
                [attr.aria-current]="page === currentPage() ? 'page' : null"
                (click)="onPageClick(page)">{{ page }}</button>
        }

        @if (showEllipsis() && showLastPage()) {
            <span class="dots" aria-hidden="true">...</span>
        }

        @if (showLastPage()) {
            <button 
                class="page-number"
                [class.active]="lastPage() === currentPage()"
                [attr.aria-label]="'Go to page ' + lastPage()"
                [attr.aria-current]="lastPage() === currentPage() ? 'page' : null"
                (click)="onPageClick(lastPage()!)">{{ lastPage() }}</button>
        }
    </div>

    <button class="pagination-nav next"
            [style.visibility]="hasNextButton() ? 'visible' : 'hidden'"
            [attr.aria-label]="'Go to next page'"
            [disabled]="!hasNextButton()"
            (click)="onPageClick(currentPage() + 1)">
        Next <span class="chevron">&rsaquo;</span>
    </button>
   
</nav>
