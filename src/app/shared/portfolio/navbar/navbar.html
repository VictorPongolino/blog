<section [class.fixed]="isDetailPage()">

    <div class="sticky-title" 
         [class.visible]="scrollTitleService.isScrolled() && scrollTitleService.currentScrollTitle()">
        <h2>{{ scrollTitleService.currentScrollTitle() }}</h2>
    </div>
    
    <div class="toggleBox" 
         [style.visibility]="scrollTitleService.isScrolled() && scrollTitleService.currentScrollTitle() ? 'hidden' : 'visible'"
         (click)="toggleMenu()">
        <svg class="nav-icon nav-icon--menu" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path d="M6 9h20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            <path d="M6 16h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />
            <path d="M6 23h20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="26.5" cy="16" r="1.5" fill="currentColor" opacity="0.9" />
        </svg>
    </div>
    <nav [class.open]="isMenuOpen()"
         [style.visibility]="scrollTitleService.isScrolled() && scrollTitleService.currentScrollTitle() ? 'hidden' : 'visible'">
        <div class="nav-links">
            <a [routerLink]="['/']" (click)="closeMenu()" i18n="@@navbar-portfolio">Portfólio</a>
            <a [routerLink]="['/']" (click)="closeMenu()" i18n="@@navbar-contact">Contato</a>
        </div>
