<app-blog-layout
    [recommended]="recommended()"
    (searchSubmitted)="onUserSearchedContent($event)"
>
    <div class="mobile-title">
        <span> </span>
        <h3 i18n="@@article-layout-mobile-title">Postagens</h3>
        <span> </span>
    </div>    
    <app-article-catalog
        [articles]="articles"
        [showSearchControl]="showSearchControl()"
        [searchQuery]="searchedContent().content ?? ''"
        (visibleArticlesChange)="onVisibleArticlesChange($event)"
    ></app-article-catalog>
</app-blog-layout>
