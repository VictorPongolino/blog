<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Redirect unknown GitHub Pages routes to index with the original path encoded.
      (function () {
        const locationData = window.location;
        const basePath = locationData.pathname.split("/").slice(0, 1).join("/");
        const routePath = locationData.pathname
          .slice(1)
          .split("/")
          .slice(0)
          .join("/")
          .replace(/&/g, "~and~");
        const query = locationData.search
          ? "&" + locationData.search.slice(1).replace(/&/g, "~and~")
          : "";

        locationData.replace(
          locationData.protocol +
            "//" +
            locationData.hostname +
            (locationData.port ? ":" + locationData.port : "") +
            basePath +
            "/?/" +
            routePath +
            query +
            locationData.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
